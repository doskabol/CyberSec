Q18. Which access control model applies the strictest access control and is often used in military and mission critical applications?~attribute-based~nondiscretionary~*mandatory~discretionary~@@Mandatory access control (MAC) — самая строгая модель, доступ определяется метками и уровнями допуска. Её используют в военных и критичных системах.
Q19. What is the purpose of the network security authentication function?~to keep track of the actions of a user~*to require users to prove who they are~to determine which resources a user can access~to provide challenge and response questions~@@Аутентификация заставляет пользователя доказать, кто он. Авторизация определяет доступные ресурсы, а учёт (accounting) ведёт журнал действий.
Q20. A network administrator is configuring an AAA server to manage RADIUS authentication. Which two features are included in RADIUS authentication? (Choose two.)~*single process for authentication and authorization~encryption for only the data~encryption for all communication~separate processes for authentication and authorization~*hidden passwords during transmission~@@RADIUS объединяет аутентификацию и авторизацию в один процесс и шифрует только пароль при передаче (по UDP). Шифрование всего обмена и раздельные процессы — это TACACS+.
Q21. Passwords, passphrases, and PINs are examples of which security term?~access~*authentication~identification~authorization~@@Пароли, парольные фразы и PIN-коды — методы аутентификации, то есть подтверждения личности.
Q22. An intern has started working in the support group. One duty is to set local policy for passwords on the workstations. What tool would be best to use?~grpol.msc~password policy~*secpol.msc~system administration~account policy~@@secpol.msc — оснастка локальной политики безопасности Windows, где задают политику паролей на конкретной машине.
Q23. What is privilege escalation?~Everyone is given full rights by default to everything and rights are taken away only when someone abuses privileges.~A security problem occurs when high ranking corporate officials demand rights to systems or files that they should not have.~Someone is given rights because she or he has received a promotion.~*Vulnerabilities in systems are exploited to grant higher levels of privilege than someone or some process should have.~@@Повышение привилегий — использование уязвимостей, чтобы получить больше прав, чем положено пользователю или процессу. После этого атакующий получает доступ к данным или контроль над системой.
Q24. Which access control model allows users to control access to data as an owner of that data?~nondiscretionary access control~mandatory access control~attribute-based access control~*discretionary access control~@@В discretionary access control (DAC) владелец данных сам решает, кому дать доступ.`].map(t=>t.split('\n').map((l,i)=>parse(l,i,0,true)));

const app=document.getElementById('app');
let S=null;
function home(){
  S=null;scrollTo(0,0);
  let h=`<h1>🛡️ Cybersecurity Midterm — тренажёр</h1><p class="sub">Вопросы в формате экзамена (Cisco Cybersecurity Essentials). Каждый ответ проверяется сразу после выбора.</p>
  <h2>Полные варианты — 25 вопросов, весь курс</h2><div class="grid">`;
  for(let v=0;v<5;v++)h+=`<button class="c" onclick="start('full',${v})"><b>Вариант ${v+1}</b><span>25 вопросов · модули 1–13</span></button>`;
  h+=`</div><h2>По модулям — 15 вопросов</h2><div class="grid">`;
  for(let m=1;m<=13;m++)h+=`<button class="c" onclick="start('mod',${m})"><b>Module ${String(m).padStart(2,'0')}</b><span>${MN[m]}</span></button>`;
  h+=`</div><h2>Чекпоинты (с объяснениями после ответа)</h2><div class="grid"><button class="c" onclick="start('cp',0)"><b>Чекпоинт 7-10</b><span>OS and Endpoint Security · модули 7–10</span></button><button class="c" onclick="start('cp',1)"><b>Чекпоинт 11-13</b><span>Principles, Practices and Processes of Network Defense · модули 11–13</span></button></div><h2>Вариант из Google Form</h2><div class="grid"><button class="c lk" onclick="start('leak')"><b>Midterm Quiz Group 1 <span class="tag" style="margin:0">leaked variant</span></b><span>Midterm Quiz Group1 08.00-10.00 · вопросы и варианты ответов точь-в-точь как в форме (Q3 разбит на 3 строки)</span></button></div>`;
  app.innerHTML=h;
}
function start(t,k){
  let qs,title;
  if(t==='full'){qs=rr.slice(k*25,k*25+25);title=`Вариант ${k+1} · весь курс`}
  else if(t==='mod'){qs=pool[k];title=`Module ${String(k).padStart(2,'0')} · ${MN[k]}`}
  else if(t==='cp'){qs=CP[k];title=k?'Чекпоинт 11-13':'Чекпоинт 7-10'}
  else{qs=leaked;title='Midterm Quiz Group 1 — leaked variant'}
  S={title,qs,a:qs.map(()=>new Set()),l:qs.map(()=>false),leak:t!=='full'&&t!=='mod',tag:t==='leak'};render();scrollTo(0,0);
}
function pick(i,j){
  if(S.l[i])return;const q=S.qs[i],s=S.a[i];
  if(q.n===1){s.add(j);S.l[i]=true}else{s.has(j)?s.delete(j):s.add(j);if(s.size===q.n)S.l[i]=true}
  render(true);if(S.l.every(Boolean))scrollTo(0,0);
}
function isOk(i){const q=S.qs[i],s=S.a[i];return q.o.every((o,j)=>o.ok===s.has(j))}
function render(keep){
  const y=scrollY;const dn=S.l.every(Boolean);const ans=S.l.filter(Boolean).length;const sc=S.qs.filter((_,i)=>S.l[i]&&isOk(i)).length;
  let h=`<div class="bar"><button class="btn g" onclick="home()">← Назад</button><span><b>${S.title}</b>${S.tag?'<span class="tag">leaked variant</span>':''}</span><span>${ans}/${S.qs.length} · верно ${sc}</span><button class="btn g" onclick="start0()">Заново</button></div>`;
  if(dn)h+=`<div class="res">Результат: ${sc} / ${S.qs.length} (${Math.round(sc/S.qs.length*100)}%)</div>`;
  S.qs.forEach((q,i)=>{
    const lk=S.l[i];const ok=lk&&isOk(i);
    h+=`<div class="q ${lk?(ok?'ok':'no'):''}"><div class="qt">${S.leak?'':(i+1)+'. '}${q.q}${q.n>1?` <small>(выбери ${q.n})</small>`:''}${!S.leak&&q.mod?` <small>· M${q.mod}</small>`:''}</div>`;
    q.o.forEach((o,j)=>{
      let c='o';if(lk){if(o.ok)c+=' r';else if(S.a[i].has(j))c+=' w'}else if(S.a[i].has(j))c+=' s';
      h+=`<button class="${c}" onclick="pick(${i},${j})">${o.t}</button>`;
    });
    if(lk&&q.e)h+=`<div class="ex">💡 ${q.e}</div>`;
    h+='</div>';
  });
  app.innerHTML=h;if(keep)scrollTo(0,y);
}
function start0(){S.a=S.qs.map(()=>new Set());S.l=S.qs.map(()=>false);render();scrollTo(0,0)}
home();
